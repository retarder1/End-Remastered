name: Build NeoForge 26.2

on:
  push:
    branches:
      - '26.2'
  pull_request:
    branches:
      - '26.2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build NeoForge
        run: ./gradlew :neoforge:build --no-daemon --stacktrace

      - name: Upload NeoForge JARs
        uses: actions/upload-artifact@v4
        with:
          name: endrem-neoforge-26.2
          path: neoforge/build/libs/*.jar
          if-no-files-found: error
